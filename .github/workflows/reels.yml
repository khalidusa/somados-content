name: بناء ريلز الشهر

# الزر: Actions ← بناء ريلز الشهر ← Run workflow
on:
  # كل ٣ ساعات: شهر مكتمل يخرج في ثوانٍ، وتشغيل منقطع يُستأنف من حيث وقف.
  schedule:
    - cron: '50 */3 * * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'الشهر (YYYY-MM). اتركه فارغاً للشهر القادم'
        required: false
        type: string
      force:
        description: 'إعادة بناء الشهر من الصفر'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: somados-reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      - name: تخزين متصفح Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx puppeteer browsers install chrome-headless-shell

      - name: فحص ما قبل التشغيل
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: npm run doctor

      - name: بناء الريلز
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
          CF_ACCOUNT_ID_4: ${{ secrets.CF_ACCOUNT_ID_4 }}
          CF_API_TOKEN_4: ${{ secrets.CF_API_TOKEN_4 }}
          CF_ACCOUNT_ID_5: ${{ secrets.CF_ACCOUNT_ID_5 }}
          CF_API_TOKEN_5: ${{ secrets.CF_API_TOKEN_5 }}
          MONTH: ${{ inputs.month }}
        run: node src/reels.mjs ${{ inputs.force && '--force' || '' }}

      - name: حفظ الخطة
        run: |
          git config user.name  "somados-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "محتوى: ريلز الشهر"
          git push

      - name: نشر الوسائط على فرع media
        run: |
          git config user.name  "somados-bot"
          git config user.email "bot@users.noreply.github.com"
          # فرع يتيم يُعاد بناؤه كل مرة: حذف ملف من git لا يصغّر التاريخ أبداً،
          # وبـ180 ميغابايت من الريلز شهرياً يتجاوز الريبو غيغابايت خلال سنة.
          git checkout --orphan media-tmp
          git reset
          git add -f posts .nojekyll || true
          touch .nojekyll && git add -f .nojekyll
          git commit -m "media: $(date -u +%F)" --quiet || exit 0
          git push -f origin media-tmp:media
